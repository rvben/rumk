[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "rumk"
dynamic = ["version"]
description = "A fast linter for Makefiles"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ruben Jongejan" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rvben/rumk"
Documentation = "https://github.com/rvben/rumk#readme"
Repository = "https://github.com/rvben/rumk.git"
Issues = "https://github.com/rvben/rumk/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true

