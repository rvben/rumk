name: Release

on:
  push:
    tags:
      - "v*"
      - "!v0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

# The steps run make targets, so each one can be reproduced locally.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Validate release metadata
        env:
          # A pushed tag must match Cargo.toml; a manual run checks the metadata only.
          EXPECTED: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: make release-validate RELEASE_EXPECTED="${EXPECTED}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            format: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            format: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            format: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Python package builder
        run: make release-tools

      - name: Build, smoke-test, and package the release
        run: make release-build RELEASE_TARGET="${{ matrix.target }}" RELEASE_FORMAT="${{ matrix.format }}"

      - name: Upload platform archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release bundle
    needs: [validate, build, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create and verify checksums
        run: make release-checksums

      - name: Upload assembled bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Build Python source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install Python package builder
        run: make release-tools

      - name: Build source distribution
        run: make release-sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-sdist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish registries and GitHub release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Download assembled bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-bundle
          path: dist

      - name: Prepare draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-draft RELEASE_TAG="${GITHUB_REF_NAME}"

      - name: Obtain short-lived crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate when absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: make release-publish-crate

      - name: Prepare Python distributions
        run: make release-pypi-dist

      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist
          skip-existing: true

      - name: Attest release archives
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-finalize RELEASE_TAG="${GITHUB_REF_NAME}"

      - name: Move the major Action tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-move-action-tag

  vscode:
    name: Publish VS Code extension
    if: needs.validate.outputs.publish == 'true'
    # Runs after the registries have this version, so the extension never
    # bundles a server release that is not public.
    needs: [validate, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/vscode.yml
    with:
      publish: true
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
