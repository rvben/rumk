name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Read and validate version
        id: metadata
        shell: bash
        run: |
          package_id="$(cargo pkgid --locked)"
          version="${package_id##*[#@]}"
          expected=""
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected="${GITHUB_REF_NAME}"
            publish=true
          fi
          ./scripts/validate-release.sh "${expected}"
          prerelease=false
          if [[ "${version}" == 0.0.* || "${version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            format: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            format: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            format: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Python package builder
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            python -m pip install "maturin[zig]>=1.8,<2.0"
          else
            python -m pip install "maturin>=1.8,<2.0"
          fi

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke-test native binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/rumk"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          "${binary}" version
          "${binary}" check Makefile

      - name: Package release archive
        shell: bash
        run: ./scripts/package-release.sh "${{ matrix.target }}" "${{ needs.validate.outputs.version }}" "${{ matrix.format }}"

      - name: Build Python wheel
        shell: bash
        run: |
          args=(--locked --release --target "${{ matrix.target }}")
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            args+=(--compatibility manylinux2014 --zig)
          fi
          maturin build "${args[@]}"
          cp target/wheels/*.whl dist/

      - name: Upload platform archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release bundle
    needs: [validate, build, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create and verify checksums
        shell: bash
        run: |
          cd dist
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "no release archives were downloaded" >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload assembled bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Build Python source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install Python package builder
        run: python -m pip install "maturin>=1.8,<2.0"

      - name: Build source distribution
        run: maturin sdist --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sdist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish crate and GitHub release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Download assembled bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bundle
          path: dist

      - name: Prepare draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./scripts/release-notes.sh "${VERSION}" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "release notes are empty for ${VERSION}" >&2
            exit 1
          fi

          if state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${state}" != "true" ]]; then
              echo "release ${GITHUB_REF_NAME} is already public; refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "Rumk ${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            args=("${GITHUB_REF_NAME}" dist/* --draft --verify-tag --title "Rumk ${GITHUB_REF_NAME}" --notes-file release-notes.md)
            if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest)
            fi
            gh release create "${args[@]}"
          fi

      - name: Obtain short-lived crates.io credential
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@63a7064947ceca9989005e118db3a5fecdc9259f # v1.0.0

      - name: Publish crate when absent
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          endpoint="https://crates.io/api/v1/crates/rumk/${VERSION}"
          if curl --fail --silent --show-error --user-agent "rumk-release-workflow" --output /dev/null "${endpoint}"; then
            echo "rumk ${VERSION} is already on crates.io; skipping publication"
          else
            cargo publish --locked
          fi

      - name: Attest release archives
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=("${GITHUB_REF_NAME}" --draft=false)
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release edit "${args[@]}"
