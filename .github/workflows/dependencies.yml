name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@b015afc2c81f52fbffd862469203c076e32e6edf # v0.14.3
    with:
      runner: ubuntu-24.04
      upd-version: v0.14.3
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: 7c941b4b7df90b364dec4753c62c470f6b2bcc27dd3b6b84740b49f0a8a0ffd9
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.85.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
