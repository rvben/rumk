name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@30d1d9c93804f9ec097df51ab091f4ad9463043e # v0.14.1
    with:
      runner: ubuntu-24.04
      upd-version: v0.14.1
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: 4c04040d56a09b1767e953e6c1a49723b8ad9ad55537b5923616871883ab14b1
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.85.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
