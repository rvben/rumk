name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@26b08c6b4c6b9ec106894394895eea05111738a5 # v0.15.1
    with:
      runner: ubuntu-24.04
      upd-version: v0.15.1
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: d3de7abc9343494bd3645e2272e5286f75df7671690460af1cf9d1df9e5cd6ab
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.85.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
