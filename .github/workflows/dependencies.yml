name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@bda704ba2b2ea116c5ab8bbbbc2eabd79041587e # v0.17.3
    with:
      runner: ubuntu-24.04
      upd-version: v0.17.3
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: 4e07259d84d9121e86ac63ae8a0ec3285da499f07c21d59479fcda88979a73b8
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.85.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
