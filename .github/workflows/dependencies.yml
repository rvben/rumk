name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@7e6bee076ba17f80de23d49609ea7f4158045089 # v0.14.2
    with:
      runner: ubuntu-24.04
      upd-version: v0.14.2
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: bd36daa32d985bedb1b926752980ac29d920d2fa20e5909ec43556a0c14350d0
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.85.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
