name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@cc719a63f7b6677760486b858210f2118f8e9824 # v0.12.2
    with:
      runner: ubuntu-24.04
      upd-version: v0.8.7
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: d48f5252383aff235e32b0b04530f07beb9237c62dec0a784451edcd8022f14e
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.82.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
