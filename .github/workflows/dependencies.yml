name: Dependency health

on:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@c3215394f3c07a0252e9c759eb23c8b83072f7b2 # v0.16.0
    with:
      runner: ubuntu-24.04
      upd-version: v0.16.0
      upd-target: x86_64-unknown-linux-gnu
      upd-sha256: 6fcd38f2b13cfc022b9d5f35738c57030335f46d0e203374e90f459b7e3b5849
      langs: ""
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install stable --profile minimal --component clippy --component rustfmt &&
        rustup toolchain install 1.85.0 --profile minimal &&
        rustup default stable
      validation-command: make dependency-check
      validate-actions: true
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): update dependencies with upd"
      auto-merge: false
