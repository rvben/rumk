[package]
name = "rumk"
version = "0.0.7"
edition = "2021"
rust-version = "1.82"
authors = ["Ruben Jongejan <ruben.jongejan@gmail.com>"]
description = "A fast linter for Makefiles"
repository = "https://github.com/rvben/rumk"
license = "MIT"
readme = "README.md"
keywords = ["makefile", "linter", "make", "build", "tool"]
categories = ["development-tools", "command-line-utilities"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/rumk.schema.json",
    "/assets/**",
    "/CHANGELOG.md",
    "/LICENSE",
    "/tests/**",
]

[dependencies]
anyhow = "1.0"
clap = { version = "~4.5", features = ["derive"] }
colored = "2.1"
dunce = "1.0.5"
# These upper bounds preserve Rust 1.82 compatibility after both crates adopted Edition 2024.
globset = ">=0.4, <0.4.17"
ignore = ">=0.4, <0.4.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"
tempfile = "3.27"
toml = "0.9"

[[bin]]
name = "rumk"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
