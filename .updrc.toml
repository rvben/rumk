# These Action dependencies cannot be updated safely as ordinary pins:
# - rust-toolchain publishes only a moving v1 tag; its stable toolchain input is intentional.
# @types/vscode must stay at or below editors/vscode/package.json's engines.vscode:
# vsce refuses to package the extension when the type definitions outrun the
# minimum supported VS Code version. Bump this alongside a deliberate
# engines.vscode change, not as an automatic refresh.
ignore = ["dtolnay/rust-toolchain", "@types/vscode"]
